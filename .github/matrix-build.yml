name: Test Matrix Multi-Job Logic

on:
  push:
    branches:
      - main
      - stage
      - test

env:
  BRANCH: ${{ github.ref_name }}

jobs:
  matrix-test:
    name: Matrix Runner for ${{ github.ref_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - job: webhook
            branch: test
            env_name: Webhook Job

          - job: email
            branch: test
            env_name: Email Transmit Job

          - job: preview
            branch: stage
            env_name: Preview Environment

          - job: production
            branch: main
            env_name: Production Deployment

    steps:
      - name: Decide if this matrix entry should run
        id: check
        run: |
          echo "Matrix branch    : ${{ matrix.branch }}"
          echo "Triggered branch : ${{ env.BRANCH }}"

          if [ "${{ matrix.branch }}" != "${{ env.BRANCH }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip non-matching jobs
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Skipping job: ${{ matrix.job }} (branch mismatch)"
          exit 0

      - name: Print info
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "---------------------------------------------"
          echo " Matrix Job       : ${{ matrix.job }}"
          echo " Environment Name : ${{ matrix.env_name }}"
          echo " Branch Matched   : ${{ env.BRANCH }}"
          echo "---------------------------------------------"

      - name: Simulate Build
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Running build for job: ${{ matrix.job }}"
          sleep 3
          echo "Build OK for ${{ matrix.job }}"

  follow-up:
    name: Triggered After Matrix (${{ github.ref_name }})
    needs: matrix-test
    runs-on: ubuntu-latest

    steps:
      - name: Final message
        run: |
          echo "Matrix execution finished for branch '${{ github.ref_name }}'."
          echo "Follow-up job executing..."
