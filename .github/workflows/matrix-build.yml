name: Test Matrix Branch Logic (Multi-Job)

on:
  push:
    branches:
      - test
      - stage
      - main

env:
  BRANCH: ${{ github.ref_name }}

jobs:
  test-branch:
    name: Run ECS-like Matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - job: webhook-test
            branch: test
            env_name: Webhook Job Test
            service: timetap-core-webhook-job

          - job: email-test
            branch: test
            env_name: Email Transmit Job Test
            service: timetap-core-email-transmit-job

          - job: email-prod
            branch: main
            env_name: Email Transmit Job Main
            service: timetap-core-email-transmit-job

          - job: email-stage
            branch: stage
            env_name: Email Transmit Job Stage
            service: timetap-core-email-transmit-job

    steps:
      - name: Check branch match
        id: check
        run: |
          echo "Matrix.branch = ${{ matrix.branch }}"
          echo "Current BRANCH = ${{ env.BRANCH }}"

          if [ "${{ matrix.branch }}" != "${{ env.BRANCH }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip non-matching entries
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "SKIPPED: ${{ matrix.job }} (branch mismatch)"
          exit 0

      - name: Run simulated ECS deploy
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "---------------------------------------------"
          echo "Running MATRIX JOB : ${{ matrix.job }}"
          echo "Environment Name   : ${{ matrix.env_name }}"
          echo "Service Name       : ${{ matrix.service }}"
          echo "Branch Matched     : ${{ env.BRANCH }}"
          echo "---------------------------------------------"
          sleep 2
          echo "SIMULATED SUCCESSFUL DEPLOY OF ${{ matrix.job }}"

  second-job:
    name: Follow-up
    needs: test-branch
    runs-on: ubuntu-latest

    steps:
      - name: Confirmation
        run: echo "Follow-up job executed successfully for ${{ github.ref_name }}"
