name: Test Matrix Branch Logic (Multi-Job)

on:
  push:
    branches:
      - main
      - stage
      - test

env:
  BRANCH: ${{ github.ref_name }}

jobs:
  test-branch:
    name: Run matrix job for ${{ github.ref_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            env_name: Production
          - branch: stage
            env_name: Staging
          - branch: test
            env_name: Testing

    steps:
      - name: Check branch match
        id: check
        run: |
          echo "Matrix branch: ${{ matrix.branch }}"
          echo "GitHub ref  : ${{ env.BRANCH }}"

          if [ "${{ matrix.branch }}" != "${{ env.BRANCH }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip non-matching matrix entry
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Skipping matrix entry: ${{ matrix.branch }} (branch mismatch)"
          exit 0

      - name: Print matrix + branch context
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "---------------------------------------------"
          echo "Matrix branch        : ${{ matrix.branch }}"
          echo "GitHub ref_name      : ${{ github.ref_name }}"
          echo "Environment name     : ${{ matrix.env_name }}"
          echo "---------------------------------------------"

      - name: Simulate build process
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Building and testing for environment: ${{ matrix.env_name }}"
          sleep 3
          echo "Build successful for ${{ matrix.env_name }}"

  second-job:
    name: Follow-up job (${{ github.ref_name }})
    needs: test-branch
    runs-on: ubuntu-latest

    steps:
      - name: Print follow-up confirmation
        run: |
          echo "Follow-up job executed."
          echo "Matrix filter worked for branch '${{ github.ref_name }}'."
